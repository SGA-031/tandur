# Tandur local ledger: 4 QBFT validators (ministry, operator, auditor, bank) + Postgres for the operator.
# Generated by setup.sh. Chain ID 6221. Zero gas price (enterprise profile).
name: tandur
networks:
  tandur:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
x-besu: &besu
  image: hyperledger/besu:latest
  restart: unless-stopped
  user: "0"
  networks: [tandur]
  environment:
    BESU_LOGGING: INFO
volumes:
  pg: {}
  node1: {}
  node2: {}
  node3: {}
  node4: {}
services:
  validator1:
    <<: *besu
    container_name: tandur-validator-ministry
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./node1/key:/config/key:ro
      - node1:/data
    ports:
      - "8545:8545"
      - "8645:8546"
    command: >
      --data-path=/data
      --genesis-file=/config/genesis.json
      --node-private-key-file=/config/key
      --profile=ENTERPRISE
      --min-gas-price=0
      --p2p-host=172.28.0.11
      --p2p-port=30303
      --bootnodes=enode://38febcebaee6a0a81edb90a1ed788bf8612478d049cd13322940b9955b813d2873a18f94cfa45f52ade41fb39e9559266cc47228bc6288fea0ebb341a7ed6377@172.28.0.11:30303
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL,ADMIN,DEBUG
      --rpc-http-cors-origins=*
      --rpc-ws-enabled --rpc-ws-host=0.0.0.0 --rpc-ws-port=8546
      --rpc-ws-api=ETH,NET,WEB3,QBFT
      --host-allowlist=*
      --discovery-enabled=true
    networks:
      tandur:
        ipv4_address: 172.28.0.11
  validator2:
    <<: *besu
    container_name: tandur-validator-operator
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./node2/key:/config/key:ro
      - node2:/data
    ports:
      - "8546:8545"
      - "8646:8546"
    command: >
      --data-path=/data
      --genesis-file=/config/genesis.json
      --node-private-key-file=/config/key
      --profile=ENTERPRISE
      --min-gas-price=0
      --p2p-host=172.28.0.12
      --p2p-port=30303
      --bootnodes=enode://38febcebaee6a0a81edb90a1ed788bf8612478d049cd13322940b9955b813d2873a18f94cfa45f52ade41fb39e9559266cc47228bc6288fea0ebb341a7ed6377@172.28.0.11:30303
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL,ADMIN,DEBUG
      --rpc-http-cors-origins=*
      --rpc-ws-enabled --rpc-ws-host=0.0.0.0 --rpc-ws-port=8546
      --rpc-ws-api=ETH,NET,WEB3,QBFT
      --host-allowlist=*
      --discovery-enabled=true
    networks:
      tandur:
        ipv4_address: 172.28.0.12
  validator3:
    <<: *besu
    container_name: tandur-validator-auditor
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./node3/key:/config/key:ro
      - node3:/data
    ports:
      - "8547:8545"
      - "8647:8546"
    command: >
      --data-path=/data
      --genesis-file=/config/genesis.json
      --node-private-key-file=/config/key
      --profile=ENTERPRISE
      --min-gas-price=0
      --p2p-host=172.28.0.13
      --p2p-port=30303
      --bootnodes=enode://38febcebaee6a0a81edb90a1ed788bf8612478d049cd13322940b9955b813d2873a18f94cfa45f52ade41fb39e9559266cc47228bc6288fea0ebb341a7ed6377@172.28.0.11:30303
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL,ADMIN,DEBUG
      --rpc-http-cors-origins=*
      --rpc-ws-enabled --rpc-ws-host=0.0.0.0 --rpc-ws-port=8546
      --rpc-ws-api=ETH,NET,WEB3,QBFT
      --host-allowlist=*
      --discovery-enabled=true
    networks:
      tandur:
        ipv4_address: 172.28.0.13
  validator4:
    <<: *besu
    container_name: tandur-validator-bank
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./node4/key:/config/key:ro
      - node4:/data
    ports:
      - "8548:8545"
      - "8648:8546"
    command: >
      --data-path=/data
      --genesis-file=/config/genesis.json
      --node-private-key-file=/config/key
      --profile=ENTERPRISE
      --min-gas-price=0
      --p2p-host=172.28.0.14
      --p2p-port=30303
      --bootnodes=enode://38febcebaee6a0a81edb90a1ed788bf8612478d049cd13322940b9955b813d2873a18f94cfa45f52ade41fb39e9559266cc47228bc6288fea0ebb341a7ed6377@172.28.0.11:30303
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL,ADMIN,DEBUG
      --rpc-http-cors-origins=*
      --rpc-ws-enabled --rpc-ws-host=0.0.0.0 --rpc-ws-port=8546
      --rpc-ws-api=ETH,NET,WEB3,QBFT
      --host-allowlist=*
      --discovery-enabled=true
    networks:
      tandur:
        ipv4_address: 172.28.0.14
  postgres:
    image: postgres:16-alpine
    container_name: tandur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tandur
      POSTGRES_PASSWORD: tandur
      POSTGRES_DB: tandur
    ports:
      - "5442:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    networks: [tandur]
